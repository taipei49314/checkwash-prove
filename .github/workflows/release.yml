name: release

# One version, from an annotated tag vX.Y.Z on main. The build has no secrets
# and no write token. Only the publish job can mint the PyPI token (trusted
# publishing), and it runs in the `pypi` environment, which waits for the
# maintainer's approval. See RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: The tag is annotated and lies on main
        run: |
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          git merge-base --is-ancestor HEAD origin/main
      - name: The tests passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs?head_sha=$sha&status=success&per_page=1" --jq .total_count)"
          echo "successful tests runs on $sha: $passed"
          test "$passed" -ge 1
      - name: The pypi environment waits for a reviewer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/pypi" --jq '{protection_rules: [.protection_rules[].type], can_admins_bypass}'
          test "$(gh api "repos/$GITHUB_REPOSITORY/environments/pypi" --jq '[.protection_rules[].type] | index("required_reviewers") != null')" = true
      - name: Build the sdist and the wheel
        run: |
          python -m pip install --disable-pip-version-check "build==1.3.0"
          python -m build
      - name: The files name the tag's version
        run: |
          version="${GITHUB_REF_NAME#v}"
          ls -l dist
          test "$(ls dist | wc -l)" -eq 2
          test -f "dist/checkwash_prove-$version-py3-none-any.whl"
          test -f "dist/checkwash_prove-$version.tar.gz"
          sha256sum dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    needs: build
    name: wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the wheel alone and run a real comparison with it
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python -m venv smoke
          if [ "$RUNNER_OS" = Windows ]; then
            py="$(cygpath -w "$PWD/smoke/Scripts/python.exe")"
            prove="$PWD/smoke/Scripts/checkwash-prove.exe"
          else
            py="$PWD/smoke/bin/python"
            prove="$PWD/smoke/bin/checkwash-prove"
          fi
          "$py" -m pip install --disable-pip-version-check --no-index dist/*.whl
          "$py" -m pip install --disable-pip-version-check "pytest==9.2.0"
          test "$("$prove" --version | tr -d '\r')" = "checkwash-prove $version"
          test "$("$py" -m checkwash_prove --version | tr -d '\r')" = "checkwash-prove $version"
          "$py" -c "from checkwash_prove.engine import verify_catalogue; print(verify_catalogue())"
          # A test weakened from `== 12` to `is not None`: the installed wheel must find the loss and exit 1.
          mkdir -p demo/src/calc demo/tests
          cd demo
          git init -q -b main
          git config user.email ci@example.invalid
          git config user.name ci
          printf 'def area(w, h):\n    return w * h\n' > src/calc/__init__.py
          printf 'from calc import area\n\n\ndef test_area():\n    assert area(3, 4) == 12\n' > tests/test_calc.py
          git add -A
          git commit -qm base
          printf 'from calc import area\n\n\ndef test_area():\n    assert area(3, 4) is not None\n' > tests/test_calc.py
          git commit -qam weaken
          set +e
          "$prove" HEAD~1..HEAD --python "$py" --fail-on-loss > ../demo-report.txt
          code=$?
          set -e
          cat ../demo-report.txt
          test "$code" -eq 1
          grep -q "protection losses: [1-9]" ../demo-report.txt

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/checkwash-prove/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Create the GitHub release with the files PyPI received
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "checkwash-prove $version" \
            --notes "checkwash-prove $version on PyPI: https://pypi.org/project/checkwash-prove/$version/ . Changes: https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md"
