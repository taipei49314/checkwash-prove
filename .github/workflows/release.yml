name: release

# One version, from an annotated tag vX.Y.Z on main. The build has no secrets
# and no write token. Only the publish job can mint the PyPI token (trusted
# publishing), and it runs in the `pypi` environment, which waits for the
# maintainer's approval. See RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: The tag is annotated and lies on main
        run: |
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Build the sdist and the wheel
        run: |
          python -m pip install --disable-pip-version-check "build==1.3.0"
          python -m build
      - name: The files name the tag's version
        run: |
          version="${GITHUB_REF_NAME#v}"
          ls -l dist
          test "$(ls dist | wc -l)" -eq 2
          test -f "dist/checkwash_prove-$version-py3-none-any.whl"
          test -f "dist/checkwash_prove-$version.tar.gz"
          sha256sum dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    needs: build
    name: wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the wheel alone and run it
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python -m venv smoke
          if [ -x smoke/bin/python ]; then bin=smoke/bin; else bin=smoke/Scripts; fi
          "$bin/python" -m pip install --disable-pip-version-check --no-index dist/*.whl
          test "$("$bin/checkwash-prove" --version | tr -d '\r')" = "checkwash-prove $version"
          test "$("$bin/python" -m checkwash_prove --version | tr -d '\r')" = "checkwash-prove $version"
          "$bin/checkwash-prove" --help > /dev/null

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/checkwash-prove/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Create the GitHub release with the files PyPI received
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "checkwash-prove $version" \
            --notes "checkwash-prove $version on PyPI: https://pypi.org/project/checkwash-prove/$version/ . Changes: https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md"
